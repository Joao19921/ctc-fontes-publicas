services:
  - type: web
    name: ctc-fontes-publicas-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CTC_API_TOKEN
        generateValue: true
      - key: PNCP_CONSULTA_BASE_URL
        value: https://pncp.gov.br/api/consulta
      - key: COMPRAS_GOV_BASE_URL
        value: https://dadosabertos.compras.gov.br
      - key: PUBLIC_SOURCES_TIMEOUT
        value: "30"
      - key: PUBLIC_SOURCES_MAX_RETRIES
        value: "3"
